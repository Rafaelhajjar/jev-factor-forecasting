name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra api
      - run: uv run --frozen --extra api ruff check .
      - run: uv run --frozen --extra api ruff format --check .
      - run: uv run --frozen --extra api pytest
      - run: uv run --frozen --extra api jev-factor run --config configs/synthetic.json --output runs/ci --seeds 7 --max-origins 3
  reference-r-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - run: uv sync --frozen
      - run: Rscript scripts/setup_mrf_r.R runs/r-library
      - name: Fetch checksum-pinned external GPL engine
        run: uv run python -c "from pathlib import Path; from jev_factor.replication import ensure_engine; print(ensure_engine(Path('data/raw/MRF_v210403.R')))"
      - name: Exercise actual R engine, not a mock
        env:
          JEV_MRF_REFERENCE_ENGINE: data/raw/MRF_v210403.R
          JEV_MRF_R_LIBRARY: runs/r-library
        run: uv run pytest -q tests/test_reference_r_contract.py
