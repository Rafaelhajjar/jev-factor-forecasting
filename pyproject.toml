[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-factor-forecasting"
version = "0.1.0"
description = "Experiments on probabilistic decision models as gates for factor forecasts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Rafael Hajjar"}]
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "httpx>=0.28,<1",
  "threadpoolctl>=3.6,<4"
]

[project.optional-dependencies]
api = ["typesafe-sdk==0.7.5", "system-one-adapter[openai,anthropic,gemini]==0.2.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
jev-factor = "jev_factor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_factor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
